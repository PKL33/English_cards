<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wordly — учи английский без регистрации</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#313338;--ink:#f2f3f5;--muted:#b5bac1;--purple:#5865f2;--purple2:#404675;--mint:#24483f;--yellow:#51452a;--pink:#503341;--line:#242529;--white:#2b2d31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{height:76px;background:#2b2d31;border-bottom:1px solid #232428;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font:800 22px Manrope}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#8069f3,#b5a5ff);display:grid;place-items:center;color:white;font-size:20px;box-shadow:0 7px 18px #8069f344}.user{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--purple2);color:var(--purple);display:grid;place-items:center;font-weight:800}.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:225px 1fr;gap:34px;padding:32px 24px}.side{position:sticky;top:104px;height:max-content}.nav{display:grid;gap:7px}.nav button{background:transparent;text-align:left;padding:13px 15px;border-radius:13px;color:#b5bac1;font-weight:600;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#404675;color:#fff}.nav span{font-size:18px;width:22px}.side-note{margin-top:28px;padding:18px;border-radius:18px;background:linear-gradient(145deg,#3b3e75,#34365d);font-size:13px;color:#e2e4ff;line-height:1.5}.side-note b{display:block;font-size:15px;margin-bottom:5px}.main{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:center;margin:0 0 24px;gap:16px}.welcome h1{font:800 29px Manrope;margin:0 0 6px;letter-spacing:-.8px}.muted{color:var(--muted)}.welcome p{margin:0;color:var(--muted)}.primary{background:var(--purple);color:#fff;border-radius:13px;padding:12px 17px;font-weight:700;box-shadow:0 7px 18px #7257e833;transition:.2s}.primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px #7257e844}.soft{background:var(--purple2);color:var(--purple);border-radius:11px;padding:10px 13px;font-weight:700}.ghost{background:#383a40;border:1px solid #45474e;color:#dbdee1;border-radius:11px;padding:10px 13px;font-weight:600}.hero{background:linear-gradient(110deg,#6e55e7,#927cf5);border-radius:22px;padding:26px 28px;color:#fff;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative;margin-bottom:22px;min-height:165px}.hero:after{content:"Aa";position:absolute;right:7%;font:800 120px Manrope;color:#ffffff18;transform:rotate(-12deg)}.hero h2{font:800 23px Manrope;margin:0 0 7px}.hero p{margin:0;color:#e9e4ff;max-width:390px;line-height:1.5}.hero .streak{z-index:1;background:#2b2d31fff20;border:1px solid #ffffff30;border-radius:16px;padding:14px 17px;text-align:center}.streak strong{display:block;font-size:25px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:27px}.stat{background:#2b2d31;border:1px solid var(--line);padding:16px 18px;border-radius:17px;display:flex;gap:13px;align-items:center}.stat-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:19px}.stat strong{display:block;font-size:20px}.stat small{color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 14px}.section-head h2{font:800 19px Manrope;margin:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.word-card{background:#2b2d31;border:1px solid var(--line);border-radius:18px;padding:18px;transition:.2s;position:relative;animation:rise .45s both}.word-card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #29305a12}.word-top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:11px;font-weight:800;padding:5px 8px;border-radius:7px;background:var(--mint);color:#298a69}.word-card h3{font:800 21px Manrope;margin:17px 0 2px}.trans{color:var(--muted);font-size:13px}.meaning{margin:12px 0;color:#4e5872;font-size:14px;min-height:40px;line-height:1.45}.example{font-size:12px;color:#939bb0;border-top:1px solid var(--line);padding-top:11px}.card-actions{display:flex;gap:7px;margin-top:13px}.card-actions button{font-size:12px;padding:7px 9px;border-radius:9px}.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.game{background:#2b2d31;border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;gap:15px;align-items:center;cursor:pointer;transition:.2s}.game:hover{transform:translateY(-3px);box-shadow:0 12px 25px #29305a10}.game-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:25px;flex-shrink:0}.game h3{margin:0 0 5px;font:700 16px Manrope}.game p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.panel{background:#2b2d31;border:1px solid var(--line);border-radius:20px;padding:24px}.formrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;min-width:0}.formrow>*{min-width:0}.field{min-width:0}.field input,.field textarea{width:100%;min-width:0;max-width:100%}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;color:#6f7891;font-weight:700}.field input{border:1px solid #1e1f22;background:#1e1f22;padding:12px 13px;border-radius:11px;outline:none;color:var(--ink)}.field input:focus{border-color:#9b8cf0;box-shadow:0 0 0 3px #7257e817}.modal-bg{position:fixed;inset:0;background:#15172c66;display:none;align-items:center;justify-content:center;padding:18px;z-index:20;backdrop-filter:blur(5px)}.modal-bg.show{display:flex;animation:fade .2s}.modal{background:#2b2d31;color:#f2f3f5;width:min(520px,100%);border-radius:23px;padding:25px;box-shadow:0 25px 70px #10132b33;animation:pop .25s}.modal h2{font:800 22px Manrope;margin:0 0 7px}.modal p{color:var(--muted);font-size:14px;line-height:1.5}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.close{float:right;background:#383a40;border-radius:50%;width:30px;height:30px;color:#65708a}.game-center{text-align:center;padding:15px 0}.big-word{font:800 34px Manrope;margin:20px 0 8px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.answer{background:#383a40;border:1px solid #4540a0;color:#e2e4ff;border-radius:12px;padding:13px;font-weight:700}.answer:hover{background:#404675}.progress{height:8px;border-radius:20px;background:#1e1f22;overflow:hidden;margin:17px 0}.progress i{display:block;height:100%;background:var(--purple);transition:.3s}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;background:#222944;color:white;padding:12px 18px;border-radius:12px;z-index:40;transition:.25s;font-size:14px}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{text-align:center;padding:35px;color:var(--muted);background:#2b2d31;border:1px dashed #dfe2ed;border-radius:17px}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(max-width:850px){.layout{grid-template-columns:1fr;gap:18px;padding-top:20px}.side{position:static}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-note{display:none}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.formrow{grid-template-columns:minmax(0,1fr);gap:0}.authbox{padding:25px 20px}.top{padding:0 16px}.layout{padding:20px 15px}.welcome{align-items:flex-start;flex-direction:column}.welcome h1{font-size:25px}.hero{padding:22px;min-height:150px}.hero .streak{display:none}.stats{gap:8px}.stat{padding:12px 9px;gap:8px}.stat-icon{width:34px;height:34px}.stat strong{font-size:17px}.stat small{font-size:10px}.cards,.game-grid{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.panel{padding:18px}}

.study-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.flip-card{height:190px;perspective:1000px;cursor:pointer;outline:none}
.flip-inner{height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid #45474e;border-radius:18px;background:#2b2d31;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
.flip-face.back{transform:rotateY(180deg);background:linear-gradient(145deg,#34385d,#2b2d31);border-color:#5865f2}
.flip-face strong{font:800 23px Manrope;overflow-wrap:anywhere}.flip-face small{color:#b5bac1;margin-top:10px}
.game-input{width:100%;max-width:420px;background:#1e1f22;color:#f2f3f5;border:1px solid #45474e;border-radius:12px;padding:14px;margin:12px auto;display:block}
.game-feedback{font-weight:700;min-height:24px;margin:10px 0}
.pair-board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.pair-tile{background:#383a40;color:#f2f3f5;border:1px solid #45474e;border-radius:12px;padding:13px 8px;min-height:60px;font-weight:700}
.pair-tile.selected{border-color:#5865f2;background:#404675}.pair-tile.done{opacity:.35;pointer-events:none}
@media(max-width:560px){.study-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.flip-card{height:160px}.flip-face strong{font-size:18px}.pair-board{gap:7px}.pair-tile{font-size:12px;padding:10px 5px}}
</style>
</head>
<body>
<div id="root"></div><div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<script>
const $=s=>document.querySelector(s);
const starter=[
{word:'Curious',trans:'[ˈkjʊəriəs]',meaning:'Любознательный, интересующийся',example:'She is curious about the world.',tag:'Прилагательное'},
{word:'Achieve',trans:'[əˈtʃiːv]',meaning:'Достигать, добиваться',example:'You can achieve your goals.',tag:'Глагол'},
{word:'Improve',trans:'[ɪmˈpruːv]',meaning:'Улучшать, совершенствовать',example:'I want to improve my English.',tag:'Глагол'},
{word:'Reliable',trans:'[rɪˈlaɪəbl]',meaning:'Надёжный, заслуживающий доверия',example:'He is a reliable friend.',tag:'Прилагательное'},
{word:'Opportunity',trans:'[ˌɒpəˈtjuːnəti]',meaning:'Возможность, шанс',example:'This is a great opportunity.',tag:'Существительное'},
{word:'Journey',trans:'[ˈdʒɜːni]',meaning:'Путешествие, путь',example:'Life is a long journey.',tag:'Существительное'}
];
let words=JSON.parse(localStorage.getItem('wordly_words')||'null')||starter,tests=JSON.parse(localStorage.getItem('wordly_tests')||'[]'),view='home',gameState={};
const save=()=>{localStorage.setItem('wordly_words',JSON.stringify(words));localStorage.setItem('wordly_tests',JSON.stringify(tests))};
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2300)}
function modal(content){$('#modal').innerHTML=content;$('#modalBg').classList.add('show')}
function closeModal(){$('#modalBg').classList.remove('show')}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('#root').innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="logo">W</div>wordly</div><div class="user"><span>Твой личный словарь</span><div class="avatar">W</div></div></header><div class="layout"><aside class="side"><nav class="nav">${[['home','⌂','Главная'],['cards','▤','Мои карточки'],['study','▣','Учить карточки'],['games','♧','Мини-игры'],['tests','✓','Тесты и результаты']].map(([id,ico,t])=>`<button class="${view===id?'active':''}" onclick="go('${id}')"><span>${ico}</span>${t}</button>`).join('')}</nav><div class="side-note"><b>✨ Маленький шаг каждый день</b>Повторяй слова понемногу — и скоро заметишь прогресс!</div></aside><main class="main">${page()}</main></div></div>`}
function page(){if(view==='home')return home();if(view==='cards')return cardsPage();if(view==='study')return studyPage();if(view==='games')return gamesPage();return testsPage()}
function home(){return `<div class="welcome"><div><h1>Привет! 👋</h1><p>Готов немного прокачать свой английский?</p></div><button class="primary" onclick="openAdd()">＋ Новая карточка</button></div><section class="hero"><div><h2>Каждое слово — шаг вперёд 🚀</h2><p>Создавай собственные наборы, тренируй память и делись знаниями с друзьями — без аккаунта.</p></div><div class="streak"><strong>✨ ${words.length}</strong><small>слов в словаре</small></div></section><div class="stats"><div class="stat"><div class="stat-icon" style="background:#eeeaff">📚</div><div><strong>${words.length}</strong><small>Карточек</small></div></div><div class="stat"><div class="stat-icon" style="background:#dff7ed">🎯</div><div><strong>${tests.length}</strong><small>Пройдено тестов</small></div></div><div class="stat"><div class="stat-icon" style="background:#2b2d311c9">🏆</div><div><strong>${tests.length?Math.round(tests.reduce((a,t)=>a+t.score,0)/tests.length)+'%':'—'}</strong><small>Средний результат</small></div></div></div><div class="section-head"><h2>Недавно добавленные</h2><button class="soft" onclick="go('cards')">Все карточки →</button></div>${renderCards(words.slice(-3).reverse())}<div class="section-head"><h2>Потренируемся?</h2><button class="soft" onclick="go('games')">Все игры →</button></div>${gameTiles()}</div>`}
function renderCards(list){if(!list.length)return '<div class="empty">Пока нет карточек. Создай первую — это быстро! ✨</div>';return `<div class="cards">${list.map((w,i)=>`<article class="word-card"><div class="word-top"><span class="tag">${esc(w.tag||'Слово')}</span><button class="ghost" style="padding:5px 8px" onclick="shareWord(${words.indexOf(w)})">↗</button></div><h3>${esc(w.word)}</h3><div class="trans">${esc(w.trans||'')}</div><div class="meaning">${esc(w.meaning)}</div><div class="example">“${esc(w.example||'Добавь пример предложения')}”</div><div class="card-actions"><button class="soft" onclick="editWord(${words.indexOf(w)})">Изменить</button><button class="ghost" onclick="deleteWord(${words.indexOf(w)})">Удалить</button></div></article>`).join('')}</div>`}
function cardsPage(){return `<div class="welcome"><div><h1>Мои карточки 📚</h1><p>Твой личный словарь английских слов.</p></div><button class="primary" onclick="openAdd()">＋ Добавить слово</button></div><div class="field"><input id="search" placeholder="⌕  Найти слово или перевод..." oninput="filterCards(this.value)"></div><div id="cardList">${renderCards(words.slice().reverse())}</div><div class="section-head"><h2>Поделиться словарём</h2></div><div class="panel"><p>Отправь другу набор карточек. Он сможет импортировать их в свой Wordly.</p><button class="primary" onclick="shareAll()">↗ Поделиться всеми карточками</button> <button class="ghost" onclick="importCards()">＋ Импортировать набор</button></div>`}
function filterCards(q){let a=words.filter(w=>(w.word+' '+w.meaning).toLowerCase().includes(q.toLowerCase())).reverse();$('#cardList').innerHTML=renderCards(a)}
function gameTiles(){return `<div class="game-grid">
<div class="game" onclick="startGame('ru-en')"><div class="game-ico">🇷🇺</div><div><h3>Русский → English</h3><p>Напиши перевод слова на английском.</p></div></div>
<div class="game" onclick="startGame('en-ru')"><div class="game-ico">🇬🇧</div><div><h3>English → Русский</h3><p>Напиши перевод английского слова.</p></div></div>
<div class="game" onclick="startGame('pairs')"><div class="game-ico">🧩</div><div><h3>Найди пары</h3><p>Соедини английские слова с переводами.</p></div></div>
<div class="game" onclick="startGame('truth')"><div class="game-ico">⚖️</div><div><h3>Правда или ложь</h3><p>Определи, верно ли указан перевод.</p></div></div>
</div>`}
function gamesPage(){return `<div class="welcome"><div><h1>Мини-игры 🎮</h1><p>Четыре способа проверить и закрепить словарный запас.</p></div></div>${gameTiles()}<div class="section-head"><h2>Тренируй свои слова</h2></div><div class="panel"><p>Игры используют слова из твоего словаря. Сейчас карточек: <b>${words.length}</b>.</p><button class="primary" onclick="go('cards')">Открыть мой словарь →</button></div>`}
function startGame(type){
if(words.length<2){toast('Добавь хотя бы 2 карточки для игры');return}
gameState={type,index:0,score:0,order:words.slice().sort(()=>Math.random()-.5).slice(0,Math.min(type==='pairs'?6:10,words.length)),answered:false};
if(type==='pairs'){startPairs();return}gameQuestion();
}
function gameQuestion(){
let s=gameState,w=s.order[s.index];if(!w){finishGame(s.score,s.order.length,'Игра завершена!');return}
s.current=w;s.answered=false;
if(s.type==='ru-en'||s.type==='en-ru'){
let prompt=s.type==='ru-en'?w.meaning:w.word,label=s.type==='ru-en'?'Напиши перевод на английском':'Напиши перевод на русском';
modal(`<button class="close" onclick="closeModal()">×</button><div class="muted">${s.index+1} из ${s.order.length} · Очки: ${s.score}</div><div class="progress"><i style="width:${s.index/s.order.length*100}%"></i></div><div class="game-center"><div class="muted">${label}</div><div class="big-word">${esc(prompt)}</div><form onsubmit="checkTypedAnswer(event)"><input class="game-input" id="typedAnswer" autocomplete="off" placeholder="Твой ответ..." required><button class="primary">Проверить</button></form><div id="gameFeedback" class="game-feedback"></div><div id="continueArea"></div></div>`);$('#typedAnswer').focus();return;
}
if(s.type==='truth'){
let truth=Math.random()>.5,shown=truth?w.meaning:words.filter(x=>x!==w).sort(()=>Math.random()-.5)[0].meaning;s.truth=truth;
modal(`<button class="close" onclick="closeModal()">×</button><div class="muted">Вопрос ${s.index+1} из ${s.order.length} · Очки: ${s.score}</div><div class="progress"><i style="width:${s.index/s.order.length*100}%"></i></div><div class="game-center"><div class="muted">Правда или ложь?</div><div class="big-word">${esc(w.word)}</div><p style="font-size:19px;font-weight:700">${esc(shown)}</p><div class="answers"><button class="answer" onclick="answerTruth(true)">Правда</button><button class="answer" onclick="answerTruth(false)">Ложь</button></div></div>`);
}}
function normalizeAnswer(v){return String(v).toLocaleLowerCase('ru').trim().replace(/[.,!?;:]/g,'').replace(/\s+/g,' ')}
function checkTypedAnswer(e){
e.preventDefault();if(gameState.answered)return;
let w=gameState.current,expected=gameState.type==='ru-en'?w.word:w.meaning;
let acceptable=[expected,...(gameState.type==='en-ru'?(w.meaning||'').split(/[,;]/):[])].map(normalizeAnswer);
let ok=acceptable.includes(normalizeAnswer($('#typedAnswer').value));if(ok)gameState.score++;gameState.answered=true;
$('#gameFeedback').textContent=ok?'✓ Правильно!':`✗ Правильный ответ: ${expected}`;$('#gameFeedback').style.color=ok?'#57d6a0':'#ff8b8b';$('#typedAnswer').disabled=true;$('#continueArea').innerHTML='<button class="primary" onclick="nextGameQuestion()">Дальше →</button>';
}
function nextGameQuestion(){gameState.index++;gameQuestion()}
function answerTruth(value){if(value===gameState.truth)gameState.score++;gameState.index++;gameQuestion()}
function startPairs(){
let s=gameState,chosen=s.order.slice(0,Math.min(6,s.order.length));s.pairs=chosen.map((w,i)=>({id:i,word:w.word,meaning:w.meaning}));s.pairDone=[];s.pairSelected=null;s.pairTiles=[...chosen.map((w,i)=>({id:i,side:'word',text:w.word})),...chosen.map((w,i)=>({id:i,side:'meaning',text:w.meaning}))].sort(()=>Math.random()-.5);renderPairs();
}
function renderPairs(){
let s=gameState;modal(`<button class="close" onclick="closeModal()">×</button><div class="muted">Найди соответствия · Найдено: ${s.pairDone.length}/${s.pairs.length}</div><div class="progress"><i style="width:${s.pairDone.length/s.pairs.length*100}%"></i></div><div class="pair-board">${s.pairTiles.map((t,i)=>`<button class="pair-tile ${s.pairDone.includes(t.id)?'done':''} ${s.pairSelected===i?'selected':''}" onclick="selectPairTile(${i})">${esc(t.text)}</button>`).join('')}</div><p class="muted" style="text-align:center">Выбери английское слово и его перевод.</p>`);
}
function selectPairTile(i){
let s=gameState,t=s.pairTiles[i];if(s.pairDone.includes(t.id))return;
if(s.pairSelected===null){s.pairSelected=i;renderPairs();return}
let first=s.pairTiles[s.pairSelected];if(s.pairSelected===i){s.pairSelected=null;renderPairs();return}
if(first.id===t.id&&first.side!==t.side){s.pairDone.push(t.id);s.score++;s.pairSelected=null;if(s.pairDone.length===s.pairs.length){finishGame(s.score,s.pairs.length,'Все пары найдены!');return}}
else{s.pairSelected=null}renderPairs();
}
function studyPage(){
return `<div class="welcome"><div><h1>Учить карточки 🗂️</h1><p>Нажми на карточку, чтобы перевернуть её и увидеть перевод.</p></div><button class="primary" onclick="go('cards')">＋ Управлять словами</button></div>
<div class="section-head"><h2>Все слова · ${words.length}</h2></div>
${words.length?`<div class="study-grid">${words.map(w=>`<div class="flip-card" role="button" tabindex="0" onclick="this.classList.toggle('flipped')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('flipped')}"><div class="flip-inner"><div class="flip-face front"><small>АНГЛИЙСКОЕ СЛОВО</small><strong>${esc(w.word)}</strong><small>${esc(w.trans||'Нажми, чтобы увидеть перевод')}</small></div><div class="flip-face back"><small>ПЕРЕВОД</small><strong>${esc(w.meaning)}</strong><small>Нажми, чтобы вернуть</small></div></div></div>`).join('')}</div>`:'<div class="empty">Пока нет слов. Добавь карточки в разделе «Мои карточки».</div>'}`;
}
function testsPage(){return `<div class="welcome"><div><h1>Тесты и результаты 🏆</h1><p>Проверь знания и следи за прогрессом.</p></div><button class="primary" onclick="startTest()">Пройти тест</button></div><div class="stats"><div class="stat"><div class="stat-icon" style="background:#eeeaff">📝</div><div><strong>${tests.length}</strong><small>Тестов пройдено</small></div></div><div class="stat"><div class="stat-icon" style="background:#dff7ed">🎯</div><div><strong>${tests.length?Math.max(...tests.map(t=>t.score))+'%':'—'}</strong><small>Лучший результат</small></div></div><div class="stat"><div class="stat-icon" style="background:#2b2d311c9">📈</div><div><strong>${tests.length?Math.round(tests.reduce((a,t)=>a+t.score,0)/tests.length)+'%':'—'}</strong><small>Средний балл</small></div></div></div><div class="section-head"><h2>История попыток</h2></div>${tests.length?`<div class="panel">${tests.slice().reverse().map(t=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${t.date}</b><div class="muted" style="font-size:12px">${t.correct} из ${t.total} правильных</div></div><b style="color:${t.score>=70?'#26966e':'#d18a28'}">${t.score}%</b></div>`).join('')}</div>`:'<div class="empty">Здесь появятся результаты твоих тестов. Самое время пройти первый! 🌟</div>'}`}
function go(v){view=v;render()}
function openAdd(){modal(`<button class="close" onclick="closeModal()">×</button><h2>Новая карточка ✨</h2><p>Добавь слово, перевод и пример, чтобы лучше его запомнить.</p><form onsubmit="saveWord(event)"><div class="field"><label>Слово на английском</label><input id="w" required placeholder="например, Brilliant"></div><div class="field"><label>Транскрипция (необязательно)</label><input id="tr" placeholder="[ˈbrɪliənt]"></div><div class="field"><label>Перевод и значение</label><input id="m" required placeholder="Блестящий, великолепный"></div><div class="field"><label>Пример предложения</label><input id="ex" placeholder="That's a brilliant idea!"></div><div class="field"><label>Часть речи</label><input id="tg" placeholder="Прилагательное"></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Отмена</button><button class="primary">Сохранить карточку</button></div></form>`)}
function saveWord(e){e.preventDefault();words.push({word:$('#w').value.trim(),trans:$('#tr').value.trim(),meaning:$('#m').value.trim(),example:$('#ex').value.trim(),tag:$('#tg').value.trim()||'Слово'});save();closeModal();render();toast('Карточка добавлена!')}
function editWord(i){let w=words[i];modal(`<button class="close" onclick="closeModal()">×</button><h2>Изменить карточку</h2><form onsubmit="updateWord(event,${i})"><div class="field"><label>Слово</label><input id="w" required value="${esc(w.word)}"></div><div class="field"><label>Транскрипция</label><input id="tr" value="${esc(w.trans||'')}"></div><div class="field"><label>Перевод</label><input id="m" required value="${esc(w.meaning)}"></div><div class="field"><label>Пример</label><input id="ex" value="${esc(w.example||'')}"></div><div class="field"><label>Часть речи</label><input id="tg" value="${esc(w.tag||'')}"></div><div class="modal-actions"><button type="button" class="ghost" onclick="closeModal()">Отмена</button><button class="primary">Сохранить</button></div></form>`)}
function updateWord(e,i){e.preventDefault();words[i]={word:$('#w').value,trans:$('#tr').value,meaning:$('#m').value,example:$('#ex').value,tag:$('#tg').value};save();closeModal();render();toast('Изменения сохранены')}
function deleteWord(i){if(confirm('Удалить эту карточку?')){words.splice(i,1);save();render();toast('Карточка удалена')}}
function shareWord(i){shareData([words[i]])}
function shareAll(){shareData(words)}
function shareData(data){let code=btoa(unescape(encodeURIComponent(JSON.stringify(data))));let text='Мой набор слов Wordly. Импортируй его в своём Wordly по этому коду:\n'+code;navigator.clipboard?.writeText(text).then(()=>toast('Код набора скопирован! Отправь его другу.')).catch(()=>modal(`<h2>Код для друга</h2><p>Скопируй и отправь этот код:</p><textarea style="width:100%;height:110px;border:1px solid var(--line);border-radius:10px;padding:10px">${code}</textarea><div class="modal-actions"><button class="primary" onclick="closeModal()">Готово</button></div>`));}
function importCards(){modal(`<button class="close" onclick="closeModal()">×</button><h2>Импорт набора 📥</h2><p>Вставь код, который прислал друг.</p><div class="field"><label>Код набора</label><textarea id="importCode" style="width:100%;height:110px;border:1px solid var(--line);border-radius:10px;padding:10px"></textarea></div><div class="modal-actions"><button class="ghost" onclick="closeModal()">Отмена</button><button class="primary" onclick="doImport()">Импортировать</button></div>`)}
function doImport(){try{let raw=$('#importCode').value.trim().split('\\n').pop();let arr=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!Array.isArray(arr)||!arr.every(x=>x.word&&x.meaning))throw 0;words.push(...arr);save();closeModal();render();toast('Карточки друга добавлены!')}catch(e){toast('Не получилось прочитать код. Проверь его.')}} 
function startGame(type){if(words.length<2){toast('Добавь хотя бы 2 карточки для игры');return}gameState={type,index:0,score:0,order:words.slice().sort(()=>Math.random()-.5).slice(0,Math.min(8,words.length))};gameQuestion()}
function gameQuestion(){let s=gameState, w=s.order[s.index];if(!w){finishGame(s.score,s.order.length,'Игра завершена!');return}let opts=[w,...words.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);modal(`<button class="close" onclick="closeModal()">×</button><div class="muted">Вопрос ${s.index+1} из ${s.order.length} · Очки: ${s.score}</div><div class="progress"><i style="width:${s.index/s.order.length*100}%"></i></div><div class="game-center"><div class="muted">Как переводится слово?</div><div class="big-word">${esc(w.word)}</div><div class="trans">${esc(w.trans||'')}</div><div class="answers">${opts.map(o=>`<button class="answer" onclick="gameAnswer(${words.indexOf(o)})">${esc(o.meaning)}</button>`).join('')}</div></div>`);gameState.current=w}
function gameAnswer(i){if(words[i]===gameState.current)gameState.score++;gameState.index++;gameQuestion()}
function startTest(){if(words.length<3){toast('Для теста добавь хотя бы 3 карточки');return}gameState={type:'test',index:0,score:0,order:words.slice().sort(()=>Math.random()-.5).slice(0,Math.min(10,words.length))};gameQuestionTest()}
function gameQuestionTest(){let s=gameState,w=s.order[s.index];if(!w){let score=Math.round(s.score/s.order.length*100);tests.push({date:new Date().toLocaleDateString('ru-RU'),score,correct:s.score,total:s.order.length});save();finishGame(s.score,s.order.length,'Тест завершён!',score);return}let opts=[w,...words.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);modal(`<button class="close" onclick="closeModal()">×</button><div class="muted">Тест · Вопрос ${s.index+1} из ${s.order.length}</div><div class="progress"><i style="width:${s.index/s.order.length*100}%"></i></div><div class="game-center"><div class="muted">Выбери правильный перевод</div><div class="big-word">${esc(w.word)}</div><div class="answers">${opts.map(o=>`<button class="answer" onclick="testAnswer(${words.indexOf(o)})">${esc(o.meaning)}</button>`).join('')}</div></div>`);gameState.current=w}
function testAnswer(i){if(words[i]===gameState.current)gameState.score++;gameState.index++;gameQuestionTest()}
function finishGame(score,total,title,percent){let pct=percent??Math.round(score/total*100);modal(`<div class="game-center"><div style="font-size:48px">${pct>=70?'🏆':'💪'}</div><h2>${title}</h2><div class="big-word" style="color:var(--purple)">${pct}%</div><p>Правильных ответов: ${score} из ${total}</p><p>${pct>=85?'Отличная работа! Ты отлично знаешь слова.':pct>=60?'Хороший результат! Продолжай практиковаться.':'Не сдавайся — повторение поможет запомнить слова!'}</p><div class="modal-actions"><button class="primary" onclick="closeModal();render()">Продолжить</button></div></div>`)}
render();
</script>
</body></html>
